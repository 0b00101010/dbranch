[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbranch"
version = "0.1.0"
description = "Database branching CLI for parallel worktree development"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pymysql[rsa]>=1.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
dbb = "dbranch.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/dbranch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
